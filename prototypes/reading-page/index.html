  .vA .col h2 { font-size: 26px; margin: 56px 0 8px; }
  .vA .col .fig { margin: 32px -60px; }
  .vA .col .fig .ph { aspect-ratio: 3/2; }
  .vA table { width: 100%; border-collapse: collapse; font-family: "PingFang TC", sans-serif; font-size: 15px; }

  .vA .tips { font-size: 15px; color: #5b4d33; }

  .vB .tabpanel { padding: 24px 0; }
  .vB .story { font-size: 19px; line-height: 2.05; }

  .vC .reading { background: #fff; padding: 64px 16px; }

  .vC .reading h2 { font-size: 24px; margin: 44px 0 8px; }
  .vC .margin-figs .fig { margin-bottom: 28px; }
  .vC .margin-figs .ph { aspect-ratio: 4/3; }
  .vC .evidence { display: grid; gap: 10px; margin-top: 16px; }

  .vC ol.refs { font-size: 14.5px; padding-left: 22px; }

  .vC .famzone h2 { font-size: 34px; margin: 0; }
  .vC .steps { display: flex; gap: 8px; margin: 12px 0 32px; flex-wrap: wrap; }
  .vC .steps span { background: rgba(255,255,255,.55); border-radius: 999px; padding: 4px 14px; font-size: 14px; }
  .vC .card { background: #fffaf0; border-radius: 14px; padding: 28px; margin-bottom: 24px; box-shadow: 0 3px 0 #d8a948; }
  .vC .card h3 { margin: 0 0 12px; font-size: 22px; }
  .vC .readaloud { font-size: 19px; line-height: 2.05; }

  .vC .btn { background: #2a2112; color: #fff; border: 0; border-radius: 999px; padding: 8px 18px; font-size: 15px; cursor: pointer; }
  .vC .qcards { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 16px; align-items: stretch; }
  .vC .qcards .ph { aspect-ratio: 1/1; height: 100%; }
  .vC .qc { background: #fff; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; }
  .vC .qc .tag { font-size: 26px; font-weight: 800; }
  .vC .qc .older { margin-top: auto; padding-top: 12px; border-top: 1px dashed #e0d3b0; font-size: 14.5px; color: #6a6254; }
  .vC .checklist li { list-style: none; margin: 8px 0; }
  .vC .checklist input { transform: scale(1.4); margin-right: 10px; }
  .vC .actmeta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .vC .actmeta span { background: #f6e7c4; border-radius: 6px; padding: 2px 10px; font-size: 14px; }
  @media (max-width: 860px) { .vC .doors { grid-template-columns: 1fr; min-height: 0; } .vC .reading-inner { grid-template-columns: 1fr; } .vC .qcards { grid-template-columns: 1fr; } .vC .qcards .ph { aspect-ratio: 4/3; } }

  ], fig: 2 },
  { id: "unknown", h: "還不知道的事", p: [
    "至今沒找到其他同類的實物，所以還不知道是誰、在哪裡做出它，也還不知道當時有沒有一整個製作這種機械的工坊。",
    "仍有爭論的是正面的細節：月交點指針在實物上沒有證據；2025 年一篇還沒經過同儕審查的預印本模擬認為，照某些誤差估計，齒輪可能會卡住。缺掉的三分之二，可能還在海底的沙裡。",
  ] },
];

const LEVEL = { known: "已知", inferred: "推論", legend: "傳說", unknown: "未知" };
const TYPE = { "artifact-photo": null, reconstruction: "研究重建", "replica-photo": "複製品", imagined: "想像圖" };
const refNo = k => chapter.references.findIndex(r => r.key === k) + 1;
const imgByFile = f => chapter.images.find(i => i.file === f);

// ---- 共用小元件 ----
function ph(img, extraStyle = "") {
  const cap = TYPE[img.type] ? `<span class="capsule">${TYPE[img.type]}</span>` : "";
  return `<div class="ph" data-type="${img.type}" style="${extraStyle}" role="img" aria-label="${img.alt}">${cap}〔${img.file}〕<br>${img.alt}</div>`;
}
function fig(img, extra = "") {
  return `<figure class="fig">${ph(img, extra)}<figcaption>${img.caption}${img.credit ? `<span class="credit">${img.credit}</span>` : ""}</figcaption></figure>`;
}
const lvl = l => `<span class="level ${l}">${LEVEL[l]}</span>`;
const refsList = () => `<ol class="refs">${chapter.references.map(r => `<li>${r.text} <a href="${r.url}">連結</a>（查閱 ${r.accessed}）</li>`).join("")}</ol><p class="checked">最後查核：${chapter.lastChecked}</p>`;
const evTable = () => `<table><thead><tr><th>主張</th><th>證據等級</th><th>參考資料</th></tr></thead><tbody>${chapter.evidenceNotes.map(n => `<tr><td>${n.claim}</td><td>${lvl(n.level)}</td><td>${n.refs.map(refNo).map(n => `〔${n}〕`).join("") || "—"}</td></tr>`).join("")}</tbody></table>`;
const QLABEL = { see: "看到", think: "覺得", wonder: "好奇" };
let storyText = "";

// ---- A：雜誌長文。單欄敘事、全幅主圖；親子共學是頁末換色的第二幕 ----
function VariantA() {
  const f = chapter.family, a = f.activity;
  return `<div class="vA">
  <header class="hero"><div class="kicker">古文明 · 超前技術</div><h1>${chapter.title}</h1><p class="summary">${chapter.summary}</p>${ph(chapter.images[0])}<p style="font-size:13px;color:#8a8173;margin-top:6px">${chapter.images[0].caption} ${chapter.images[0].credit}</p></header>
  <div class="col">
    ${sections.map(s => `<h2 id="${s.id}">${s.h}</h2>${s.p.map(t => `<p>${t}</p>`).join("")}${s.fig ? fig(chapter.images[s.fig]) : ""}`).join("")}
    <h2>證據說明</h2>${evTable()}
    <h2>參考資料</h2>${refsList()}
  </div>
  <section class="family" id="family"><div class="family-inner">
    <h2>親子共學</h2><p class="lede">給家長和 6–10 歲的孩子：先唸故事，再一起看照片，最後動手做。</p>
    <h3>故事開場</h3><div class="story"><div class="meta">可以照著唸 · 約 3 分鐘</div>${storyText}</div>
    <h3>觀察提問</h3><div class="qgrid"><div>${fig(imgByFile(f.anchorImage))}</div><div>
      ${Object.entries(f.questions).map(([k, q]) => `<div class="q"><b>${QLABEL[k]}</b>${q.basic}<div class="older">大一點的孩子：${q.older}</div></div>`).join("")}
      <div class="tips"><b>家長提示</b><ul>${f.parentTips.map(t => `<li>${t}</li>`).join("")}</ul></div></div></div>
    <h3>家庭探索活動：${a.name}</h3><div class="act"><div><b>所需時間</b> ${a.minutes} 分鐘<br><b>材料</b><ul>${a.materials.map(m => `<li>${m}</li>`).join("")}</ul><div class="adult"><b>大人要做什麼</b><br>${a.adultRole}</div></div><div><b>步驟</b><ol>${a.steps.map(s => `<li>${s}</li>`).join("")}</ol><p style="color:#6a6254;font-size:15px">${a.link}</p></div></div>
  </div></section></div>`;
}

// ---- B：側欄導覽。左目錄、右側欄常駐證據說明；親子共學收進分頁框 ----
function VariantB() {
  const f = chapter.family, a = f.activity;
  const tab = location.hash.startsWith("#tab-") ? location.hash.slice(5) : "story";
  const panels = {
    story: `<div class="story">${storyText}</div>`,
    questions: `<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">${fig(imgByFile(f.anchorImage))}<div>${Object.entries(f.questions).map(([k, q]) => `<div class="qrow"><div class="tag">${QLABEL[k]}</div><div>${q.basic}<div class="older">大一點的孩子：${q.older}</div></div></div>`).join("")}<p style="font-size:14px;color:#666">${f.parentTips.join("<br>")}</p></div></div>`,
    activity: `<h3 style="margin-top:0">${a.name} · ${a.minutes} 分鐘</h3><p><b>材料：</b>${a.materials.join("、")}</p><ol>${a.steps.map(s => `<li>${s}</li>`).join("")}</ol><p><b>大人要做什麼：</b>${a.adultRole}</p><p style="color:#777">${a.link}</p>`,
  };
  return `<div class="vB">
  <div class="top"><div class="top-inner"><h1>${chapter.title}</h1><p class="summary">${chapter.summary}</p><div class="meta">古文明 · 超前技術 · 閱讀約 15 分鐘 · 最後查核 ${chapter.lastChecked}</div></div></div>
  <div class="layout">
    <nav id="toc"><div class="navgroup">深入正文</div>${sections.map(s => `<a href="#${s.id}">${s.h}</a>`).join("")}<a href="#evidence">證據說明</a><a href="#refs">參考資料</a><div class="navgroup">親子共學</div><a href="#family">故事・提問・活動</a></nav>
    <main>
      ${fig(chapter.images[0])}
      ${sections.map(s => `<h2 id="${s.id}">${s.h}</h2>${s.p.map(t => `<p>${t}</p>`).join("")}${s.fig ? fig(chapter.images[s.fig]) : ""}`).join("")}
      <h2 id="evidence">證據說明</h2>${evTable()}
      <h2 id="refs">參考資料</h2>${refsList()}
      <section class="familybox" id="family"><h2>親子共學</h2><div class="tabs">${[["story", "故事開場"], ["questions", "觀察提問"], ["activity", "家庭探索活動"]].map(([k, t]) => `<button class="${k === tab ? "on" : ""}" data-tab="${k}">${t}</button>`).join("")}</div><div class="tabpanel">${panels[tab]}</div></section>
    </main>
    <aside><h4>本篇的主要主張</h4>${chapter.evidenceNotes.map(n => `<div class="claim">${lvl(n.level)}${n.claim} <small>${n.refs.map(refNo).map(x => `〔${x}〕`).join("")}</small></div>`).join("")}<p style="font-size:12.5px;color:#999;margin-top:10px">已知：有實物、測年或文獻直接支持。推論：學者的解讀。傳說：有出處的故事。未知：還沒有答案。</p></aside>
  </div></div>`;
}

// ---- C：雙入口。首屏兩扇門分流大人與親子；正文旁邊欄放圖；親子區是卡片與朗讀模式 ----
function VariantC() {
  const f = chapter.family, a = f.activity;
  return `<div class="vC">
  <div class="doors">
    <div class="titlebar"><h1>${chapter.title}</h1><p class="summary">${chapter.summary}</p></div>
    <a class="door adult" href="#read"><div class="who">給大人</div><h2>深入正文</h2><p>沉船、X 光與三十個齒輪：證據說到哪裡，傳說從哪裡開始。約 15 分鐘。</p><span class="go">開始讀 ↓</span></a>
    <a class="door family" href="#fam"><div class="who">給家長與 6–10 歲的孩子</div><h2>親子共學</h2><p>一段可以照唸的故事、一張照片三個問題、一個 25 分鐘的紙盤活動。</p><span class="go">一起來 ↓</span></a>
  </div>
  <section class="reading" id="read"><div class="reading-inner">
    <main>${sections.map(s => `<h2 id="${s.id}">${s.h}</h2>${s.p.map(t => `<p>${t}</p>`).join("")}`).join("")}
      <h2>證據說明</h2><div class="evidence">${chapter.evidenceNotes.map(n => `<div class="ev">${lvl(n.level)}<span>${n.claim}</span><span class="refs">${n.refs.map(refNo).map(x => `〔${x}〕`).join("") || "—"}</span></div>`).join("")}</div>
      <h2>參考資料</h2>${refsList()}</main>
    <div class="margin-figs">${chapter.images.map(i => fig(i)).join("")}</div>
  </div></section>
  <section class="famzone" id="fam"><div class="famzone-inner">
    <h2>親子共學</h2><div class="steps"><span>① 唸故事 3 分鐘</span><span>② 看照片聊一聊</span><span>③ 動手做 ${a.minutes} 分鐘</span></div>
    <div class="card"><h3>① 故事開場 <button class="btn" id="bigread" style="float:right">朗讀模式</button></h3><div class="readaloud" id="readaloud">${storyText}</div></div>
    <div class="card"><h3>② 觀察提問</h3><div class="qcards">${ph(imgByFile(f.anchorImage))}${Object.entries(f.questions).map(([k, q]) => `<div class="qc"><div class="tag">${QLABEL[k]}</div><p>${q.basic}</p><div class="older">大一點的孩子：${q.older}</div></div>`).join("")}</div><p style="font-size:14.5px;color:#6a6254;margin-bottom:0">家長提示：${f.parentTips.join(" ")}</p></div>
    <div class="card"><h3>③ ${a.name}</h3><div class="actmeta"><span>${a.minutes} 分鐘</span><span>${a.steps.length} 步</span><span>大人要在場</span></div><p><b>材料：</b>${a.materials.join("、")}</p><ul class="checklist">${a.steps.map((s, i) => `<li><label><input type="checkbox">${i + 1}. ${s}</label></li>`).join("")}</ul><p><b>大人要做什麼：</b>${a.adultRole}</p><p style="color:#6a6254">${a.link}</p></div>
  </div></section></div>`;
}

storyText = [
  "很久很久以前，大約兩千多年前，有一艘大船在希臘的海上航行。船上裝滿了好看的雕像、亮晶晶的玻璃瓶，還有一個小小的、裡面有很多齒輪的機器。",
  "後來，大船沉到了海底。雕像、瓶子和那個小機器，都躺在沙子裡，一躺就是兩千年。魚游過去，海草長出來，誰也不知道它們在那裡。",
  "有一天，一群潛水的人潛到海底，想撿海綿。他們在沙子裡看見一隻綠綠的青銅手臂，嚇了一大跳。原來，那是一座雕像的手！大家把雕像、瓶子一樣一樣撈上來，送到博物館。",
  "在博物館裡，有一團綠綠的、裂成好幾塊的青銅，看起來一點也不特別。可是有一天，有人靠近一看，發現上面有一圈一圈小小的尖齒，就像腳踏車上的齒輪。",
  "又過了一百年，科學家用一種特別的照相機，從外面照進青銅的裡面。他們看到了好多齒輪，大大小小，還有刻在上面、小到幾乎看不見的字。",
  "那些字告訴大家：這個機器是用來算天空的。轉一轉旁邊的把手，就能知道月亮什麼時候圓、什麼時候彎，還能知道太陽和月亮什麼時候會被遮住。",
  "到底是誰做了它呢？到現在，還沒有人知道。也許，答案還躺在海底的沙子裡，等著有人再去找。",
].map(t => `<p>${t}</p>`).join("");

// ---- 切換器 ----
const VARIANTS = { A: ["雜誌長文", VariantA], B: ["側欄導覽", VariantB], C: ["雙入口", VariantC] };
const KEYS = Object.keys(VARIANTS);
const current = () => { const v = new URLSearchParams(location.search).get("variant"); return KEYS.includes(v) ? v : "A"; };
function render() {
  const v = current();
  document.getElementById("root").innerHTML = VARIANTS[v][1]();
  document.getElementById("label").textContent = `${v}（${VARIANTS[v][0]}）`;
  document.querySelectorAll(".vB .tabs button").forEach(b => b.onclick = () => { history.replaceState(null, "", "#tab-" + b.dataset.tab); render(); });
  const big = document.getElementById("bigread");
  if (big) big.onclick = () => { const r = document.getElementById("readaloud"); r.classList.toggle("big"); big.textContent = r.classList.contains("big") ? "離開朗讀模式" : "朗讀模式"; if (r.classList.contains("big")) r.prepend(big); else big.parentElement === r && document.querySelector(".vC .card h3").append(big); };
  const toc = document.getElementById("toc");
  if (toc) {
    const links = [...toc.querySelectorAll("a")];
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "0px 0px -70% 0px" });
    document.querySelectorAll(".vB main [id]").forEach(el => io.observe(el));
  }
}
function go(step) {
  const i = (KEYS.indexOf(current()) + step + KEYS.length) % KEYS.length;
  const u = new URL(location.href); u.searchParams.set("variant", KEYS[i]); u.hash = "";
  history.replaceState(null, "", u); render(); scrollTo(0, 0);
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
render();
</script>
</body>
</html>
